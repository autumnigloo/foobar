[project]
name = "gridbot"
version = "0.1.0"
description = "Bot for the grid-square competition: expand outward, capture flags, fire rockets."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
